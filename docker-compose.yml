services:
  postgres:
    image: postgres:16-alpine
    container_name: scai-postgres
    environment:
      POSTGRES_USER: scai
      POSTGRES_PASSWORD: scai
      POSTGRES_DB: scai_admissions
    ports:
      - "5433:5432"
    volumes:
      - scai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scai -d scai_admissions"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scai_pgdata: